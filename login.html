<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Sign in — CLIP HUNTER</title>
  <style>
    :root{color-scheme:dark;--red:#f12b36;--line:#303030}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(190,20,32,.17),transparent 45%),#080808;color:#fff;font-family:Inter,system-ui,sans-serif}
    .brand{position:fixed;top:26px;left:clamp(20px,6vw,80px);font-weight:950;letter-spacing:2px;font-size:19px}.brand span{color:var(--red)}
    .card{width:min(440px,100%);padding:clamp(26px,6vw,42px);border:1px solid #292929;border-radius:20px;background:rgba(17,17,17,.94);box-shadow:0 24px 90px #0008}
    .eyebrow{text-align:center;color:#ff777f;font-size:11px;letter-spacing:2px;font-weight:800}
    h1{text-align:center;font-size:32px;margin:12px 0 8px;letter-spacing:-1px}
    .sub{text-align:center;color:#aaa;font-size:14px;margin:0 0 26px;line-height:1.6}
    .google,.submit,.switch{width:100%;height:48px;border-radius:10px;font-size:14px;font-weight:750;cursor:pointer}
    .google{background:#fff;color:#171717;border:0;display:flex;align-items:center;justify-content:center;gap:12px}
    .google img{width:18px;height:18px}.or{display:flex;align-items:center;gap:12px;color:#777;font-size:11px;margin:22px 0}.or:before,.or:after{content:"";height:1px;background:#333;flex:1}
    label{display:block;font-size:12px;color:#cfcfcf;margin:14px 0 7px}
    input{width:100%;height:46px;border:1px solid #363636;border-radius:9px;background:#0b0b0b;color:white;padding:0 13px;font-size:14px;outline:none}
    input:focus{border-color:var(--red);box-shadow:0 0 0 3px #f12b361c}
    .submit{margin-top:20px;border:0;background:linear-gradient(135deg,#ff424d,#c80d1b);color:white}
    .switch{margin-top:12px;border:1px solid #383838;background:transparent;color:#eee}
    .message{min-height:20px;margin:14px 0 0;text-align:center;color:#ff858b;font-size:12px;line-height:1.5}
    .back{display:block;text-align:center;color:#aaa;text-decoration:none;font-size:12px;margin-top:22px}.back:hover{color:#fff}
    .fine{font-size:10px;color:#777;text-align:center;line-height:1.5;margin:15px 0 0}
  </style>
</head>
<body>
  <a class="brand" href="index.html">CLIP <span>HUNTER</span></a>
  <main class="card">
    <div class="eyebrow">YOUR NEXT CLIP STARTS HERE</div>
    <h1 id="heading">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to continue to CLIP HUNTER.</p>
    <button class="google" id="googleBtn" type="button"><img alt="" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Continue with Google</button>
    <div class="or">OR USE EMAIL</div>
    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
      <button class="submit" id="submitBtn" type="submit">Log in</button>
    </form>
    <button class="switch" id="switchBtn" type="button">Create a new account</button>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">← Back to home</a>
    <p class="fine">Authentication is handled securely by Firebase. Your password is never stored in this website's code.</p>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // Replace these placeholder values with the Firebase web-app config.
    const firebaseConfig = {
      apiKey: "PASTE_FIREBASE_API_KEY",
      authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
      projectId: "PASTE_PROJECT_ID",
      appId: "PASTE_FIREBASE_APP_ID"
    };

    const message = document.getElementById("message");
    const form = document.getElementById("authForm");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    let mode = "login";
    const configured = !Object.values(firebaseConfig).some(v => v.startsWith("PASTE_"));

    function showError(error) {
      const messages = {
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/email-already-in-use": "This email already has an account. Please log in.",
        "auth/weak-password": "Choose a stronger password with at least 6 characters.",
        "auth/popup-closed-by-user": "Google sign-in was closed before completion.",
        "auth/unauthorized-domain": "Add this website domain to Firebase Authentication's authorized domains."
      };
      message.textContent = messages[error.code] || error.message || "Authentication failed. Please try again.";
    }
    function readyAuth() {
      if (!configured) {
        message.textContent = "Firebase setup is required before sign-in can work. Add your Firebase web config first.";
        return null;
      }
      return getAuth(initializeApp(firebaseConfig));
    }
    function setMode(next) {
      mode = next;
      heading.textContent = mode === "login" ? "Welcome back" : "Create your account";
      subtitle.textContent = mode === "login" ? "Sign in to continue to CLIP HUNTER." : "Create an account to get started.";
      submitBtn.textContent = mode === "login" ? "Log in" : "Sign up";
      switchBtn.textContent = mode === "login" ? "Create a new account" : "Already have an account? Log in";
      document.getElementById("password").autocomplete = mode === "login" ? "current-password" : "new-password";
      message.textContent = "";
    }
    switchBtn.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const auth = readyAuth();
      if (!auth) return;
      message.textContent = "Please wait…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        if (mode === "signup") await createUserWithEmailAndPassword(auth, email, password);
        else await signInWithEmailAndPassword(auth, email, password);
        message.textContent = "Signed in successfully. Your clip workspace will be connected next.";
      } catch (error) { showError(error); }
    });
    document.getElementById("googleBtn").addEventListener("click", async () => {
      const auth = readyAuth();
      if (!auth) return;
      message.textContent = "Connecting to Google…";
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        message.textContent = "Google sign-in successful. Your clip workspace will be connected next.";
      } catch (error) { showError(error); }
    });
  </script>
</body>
</html>
